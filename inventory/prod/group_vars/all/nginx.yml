nginx_vhosts:

  - name: fuelman

    server_names:
      - fuelman.shop
      - www.fuelman.shop

    primary_domain: fuelman.shop

    nginx_locations:
      - path: /
        proxy_pass: http://fuelman-ui-prod:80

      - path: /api
        proxy_pass: http://fuelmanAppProd:8080

