- name: Copy frontend nginx config
  template:
    src: nginx.conf.j2
    dest: "{{ frontend_app_dir }}/nginx.conf"

- name: Generate .dockerignore
  template:
    src: dockerignore.j2
    dest: "{{ frontend_app_dir }}/.dockerignore"

- name: Copy frontend Dockerfile
  template:
    src: Dockerfile.j2
    dest: "{{ frontend_app_dir }}/Dockerfile"

- name: Build frontend Docker image
  community.docker.docker_image:
    name: "{{ frontend_image_name }}"
    source: build
    force_source: true
    build:
      path: "{{ frontend_app_dir }}"
      args: "{{ frontend_build_args }}"
