- name: Check if DB already initialized
  stat:
    path: "{{ postgres_data_dir }}/PG_VERSION"
  register: pg_init

- name: Initialize DB (first run only)
  when: not pg_init.stat.exists
  community.docker.docker_container:
    name: "{{ postgres_container_name }}"
    image: "{{ postgres_image }}"
    state: started
    restart_policy: "no"
    env:
      POSTGRES_DB: "{{ postgres_db }}"
      POSTGRES_USER: "{{ postgres_user }}"
      POSTGRES_PASSWORD: "{{ postgres_password }}"
    volumes:
      - "{{ postgres_data_dir }}:/var/lib/postgresql/data"

- name: Create postgres data dir
  file:
    path: "{{ postgres_data_dir }}"
    state: directory
    owner: 999
    group: 999
    mode: '0755'

- name: Create cert directory
  file:
    path: "{{ postgres_cert_dir }}"
    state: directory
    owner: 999
    group: 999
    mode: '0755'

- name: Create postgres config dir
  file:
    path: "{{ postgres_config_dir }}"
    state: directory
    owner: 999
    group: 999
    mode: '0755'

