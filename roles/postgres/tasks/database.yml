---
- name: Check if application database exists
  command: >
    docker exec
    -e PGPASSWORD={{ postgres_password }}
    {{ postgres_container_name }}
    psql
    -h 127.0.0.1
    -U "{{ postgres_user }}"
    -d postgres
    -tAc "SELECT 1 FROM pg_database WHERE datname='{{ postgres_db }}';"
  register: db_exists
  changed_when: false

- name: Create application database
  command: >
    docker exec
    -e PGPASSWORD={{ postgres_password }}
    {{ postgres_container_name }}
    psql
    -h 127.0.0.1
    -U "{{ postgres_user }}"
    -d postgres
    -c "CREATE DATABASE {{ postgres_db }};"
  when: db_exists.stdout.strip() != "1"
